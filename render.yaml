# Render Infrastructure as Code (Blueprint)
# https://render.com/docs/blueprint-spec

services:
  # Node.js API Server
  - type: web
    name: cbfds-server
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_VERSION
        value: v1
      - key: APP_URL
        value: https://cbfds-server.onrender.com
      - key: FRONTEND_URL
        value: https://cbfds-client.onrender.com
      - key: MONGODB_URI
        placeholder: "mongodb+srv://username:password@cluster0.mongodb.net/cbfds"
      - key: MONGODB_DB_NAME
        value: cbfds
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        value: cbfds-chunks
      - key: AWS_ACCESS_KEY_ID
        value: demo_aws_access_key
      - key: AWS_SECRET_ACCESS_KEY
        value: demo_aws_secret_key
      - key: AWS_REGION
        value: eu-north-1

  # React Frontend Static Web App
  - type: web
    name: cbfds-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cbfds-server.onrender.com/api/v1
