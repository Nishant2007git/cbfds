version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:6.0
    container_name: cbfds-prod-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: cbfds
    volumes:
      - mongodb-prod-data:/data/db
    networks:
      - cbfds-prod-network

  # Redis service
  redis:
    image: redis:7.0-alpine
    container_name: cbfds-prod-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-prod-data:/data
    networks:
      - cbfds-prod-network

  # MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: cbfds-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-prod-data:/data
    networks:
      - cbfds-prod-network

  # API Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cbfds-prod-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_VERSION: v1
      APP_URL: http://localhost
      FRONTEND_URL: http://localhost
      MONGODB_URI: mongodb://mongodb:27017/cbfds
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: production_super_secret_jwt_key_at_least_32_chars
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      STORAGE_BUCKET: cbfds-chunks
    depends_on:
      - mongodb
      - redis
      - minio
    networks:
      - cbfds-prod-network

  # Frontend Nginx Web Server
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cbfds-prod-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - cbfds-prod-network

volumes:
  mongodb-prod-data:
  redis-prod-data:
  minio-prod-data:

networks:
  cbfds-prod-network:
    driver: bridge
